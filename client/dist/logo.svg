<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E50914" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#logoGrad)" filter="url(#subtleGlow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Modern Geometric Microphone -->
  <!-- Mic Capsule -->
  <rect x="44" y="24" width="32" height="46" rx="16" fill="#FFFFFF" />
  <line x1="44" y1="46" x2="76" y2="46" stroke="#E50914" stroke-width="3" stroke-linecap="round" />
  
  <!-- Sound waves / Grille accents -->
  <line x1="52" y1="34" x2="68" y2="34" stroke="#E50914" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="58" x2="70" y2="58" stroke="#E50914" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Mic Arc Support -->
  <path d="M34 50 C34 74, 86 74, 86 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  
  <!-- Mic Stem & Base -->
  <line x1="60" y1="74" x2="60" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="42" y1="88" x2="78" y2="88" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
</svg>
